services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pi_swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi_swarm}
      POSTGRES_DB: ${POSTGRES_DB:-pi_swarm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pi-swarm-postgres:/var/lib/postgresql/data
      - ./absurd.sql:/docker-entrypoint-initdb.d/001-absurd.sql:ro
      - ./queue.sql:/docker-entrypoint-initdb.d/002-queue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pi-swarm-postgres:
