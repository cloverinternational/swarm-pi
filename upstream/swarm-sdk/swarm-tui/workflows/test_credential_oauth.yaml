# OAuth Credential Test Workflow
# Tests workflow execution with OAuth credentials using @current provider.
# This workflow verifies that the credential resolution system correctly
# finds and uses OAuth tokens when no environment variables are set.

id: test-credential-oauth
name: OAuth Credential Test
description: |
    Tests workflow execution with OAuth credentials using @current provider.
    Verifies that the workflow system can resolve credentials from OAuth tokens,
    account registry, and credentials.json - not just environment variables.
version: 1.0.0

config:
    allow_human_intervention: false
    fail_on_steering_block: false
    max_duration: 2m
    max_retries: 1
    timeout_behavior: partial

groups:
    - id: analysis
      name: Analysis Group
      description: Single agent group to test OAuth credential resolution
      execution: sequential
      timeout: 1m

      completion:
          threshold: 1
          type: all

      agents:
          - id: analyzer
            name: Credential Test Analyzer
            description: Verifies OAuth credentials work by processing a simple request
            provider: "@current"
            model: "@current"
            system_prompt: |
                You are a simple test agent used to verify that OAuth credential
                resolution works correctly in the workflow system.

                When you receive input, respond with a brief acknowledgment that
                includes:
                1. A confirmation that you received the input
                2. A short summary of what was asked
                3. A simple response

                Keep your response under 50 words.
            capabilities:
                max_tokens: 500
                temperature: 0.3
            tools: []

dependencies: []

metadata:
    author: SwarmOS Team
    category: testing
    tags:
        - test
        - oauth
        - credentials
        - current-provider
    use_cases:
        - Testing OAuth credential resolution in workflows
        - Verifying @current provider and model resolution
        - Validating credential priority order

steering:
    type: rule-based
