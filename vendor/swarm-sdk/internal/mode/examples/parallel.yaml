# Parallel Mode - Multiple Agents Running Concurrently
# This mode demonstrates parallel execution with consensus-based completion.

name: "parallel_research"
description: "Multiple agents research a topic in parallel"
version: "1.0.0"

config:
  max_duration: "10m"
  allow_human_intervention: true

groups:
  - name: "research"
    execution: "parallel"
    timeout: "8m"
    
    completion:
      type: "consensus"
      threshold: 0.7
      min_agents: 2
    
    agents:
      - name: "researcher1"
        provider: "openai"
        model: "gpt-4"
        system_prompt: "You are a research specialist."
        tools: ["file_read", "grep", "web_search"]
        capabilities:
          max_tokens: 4000
          temperature: 0.7
      
      - name: "researcher2"
        provider: "anthropic"
        model: "claude-sonnet-4"
        system_prompt: "You are a research specialist with a different perspective."
        tools: ["file_read", "grep"]
        capabilities:
          max_tokens: 4000
          temperature: 0.7
      
      - name: "researcher3"
        provider: "openai"
        model: "gpt-4o-mini"
        system_prompt: "You are a quick research assistant."
        tools: ["grep", "file_read"]
        capabilities:
          max_tokens: 2000
          temperature: 0.5
