# ============================================================================
# OpenRouter - Multi-provider aggregator
# ============================================================================

[profiles.openrouter]
name = "openrouter"
display_name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
compatible_with = "openai"
quirk_adapter = "openrouter"

[profiles.openrouter.auth]
type = "bearer"
header_name = "Authorization"
header_format = "Bearer {api_key}"

[[profiles.openrouter.auth.extra_headers]]
name = "HTTP-Referer"
value = "{app_url}"
required = false

[[profiles.openrouter.auth.extra_headers]]
name = "X-Title"
value = "{app_name}"
required = false

[profiles.openrouter.features]
chat_completion = true
streaming = true
function_calling = true
vision = true  # Depends on model
audio = false
reasoning_effort = false
verbosity = false
custom_tools = false
max_tokens_param = "max_tokens"
system_prompt_style = "message"

[profiles.openrouter.models]
prefix = ""
format = "{provider}/{model}"  # e.g., "openai/gpt-4", "anthropic/claude-3"
supports_discovery = true

[profiles.openrouter.transforms]
remove_params = ["reasoning_effort", "verbosity"]

