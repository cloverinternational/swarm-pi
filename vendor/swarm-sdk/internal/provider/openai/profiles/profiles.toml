# Built-in Provider Profiles for OpenAI-Compatible APIs
# These profiles define known providers with their quirks and features

[profiles.openai]
name = "openai"
display_name = "OpenAI"
base_url = "https://api.openai.com/v1"
compatible_with = "openai"
quirk_adapter = ""  # No adapter needed (reference implementation)

[profiles.openai.auth]
type = "bearer"
header_name = "Authorization"
header_format = "Bearer {api_key}"

[profiles.openai.features]
chat_completion = true
streaming = true
function_calling = true
vision = true
audio = false
reasoning_effort = true
verbosity = true
custom_tools = true
max_tokens_param = "auto"  # Auto-detect based on model
system_prompt_style = "message"

[profiles.openai.models]
prefix = ""
format = "{model}"
supports_discovery = true

# ============================================================================
# Z.AI GLM Coding Plan - GLM-4.6, GLM-4.5, GLM-4.5-air
# ============================================================================

[profiles.glm]
name = "glm"
display_name = "Z.AI GLM Coding Plan"
base_url = "https://api.z.ai/api/coding/paas/v4"
compatible_with = "openai"
quirk_adapter = ""  # Uses passthrough (standard OpenAI protocol)

[profiles.glm.auth]
type = "bearer"
header_name = "Authorization"
header_format = "Bearer {api_key}"

[profiles.glm.features]
chat_completion = true
streaming = true
function_calling = true
vision = false  # Not documented for coding API
audio = false
reasoning_effort = false  # Not mentioned in docs
verbosity = false  # Not mentioned in docs
custom_tools = false  # Standard function calling only
max_tokens_param = "max_tokens"
system_prompt_style = "message"

[profiles.glm.models]
prefix = ""
format = "{model}"
supports_discovery = false  # Known models only
# Known models: GLM-4.6 (standard), GLM-4.5 (previous), GLM-4.5-air (lightweight)

[profiles.glm.notes]
description = "Z.AI GLM Coding Plan optimized for code generation, debugging, and analysis"
requires_upgrade = "Cursor requires model names in uppercase (GLM-4.6)"
api_endpoint = "Must use https://api.z.ai/api/coding/paas/v4 (not general API)"

# ============================================================================
# Z.AI Vision Models - GLM-5V-Turbo, GLM-4.6V, GLM-4.5V
# ============================================================================
[profiles.glm-vision]
name = "glm-vision"
display_name = "Z.AI Vision Models"
base_url = "https://api.z.ai/api/paas/v4"  # General API (supports vision!)
compatible_with = "openai"
quirk_adapter = ""  # Standard OpenAI protocol

[profiles.glm-vision.auth]
type = "bearer"
header_name = "Authorization"
header_format = "Bearer {api_key}"

[profiles.glm-vision.features]
chat_completion = true
streaming = true
function_calling = true
vision = true  # Vision enabled for multimodal analysis
audio = false
reasoning_effort = true  # GLM-5V supports thinking mode
verbosity = false
custom_tools = true
max_tokens_param = "max_tokens"
system_prompt_style = "message"

[profiles.glm-vision.models]
prefix = ""
format = "{model}"
supports_discovery = false
# Vision models: glm-5v-turbo (best), glm-4.6v, glm-4.5v

[profiles.glm-vision.notes]
description = "Z.AI vision models for image analysis, design-to-code, and multimodal tasks"
api_endpoint = "Must use https://api.z.ai/api/paas/v4 (general API, not coding API)"
pricing = "GLM-5V-Turbo: $1.20/M input, $4/M output"
context_window = "200K tokens, 128K max output"

